<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Pokedex</title>
  <!-- Linker til CSS-->
  <link rel="stylesheet" href="Pokemon.css">
</head>
<body>

  <h1> The Pokedex</h1>

  <!-- Legger opp til filtre på toppen av siden-->
  <div class="controls">
    <input type="text" id="search" placeholder="Search Pokemon...">
    <select id="filter-element" title="Filter by element">
      <option value="">All Elements</option>
    </select>
    <select id="filter-game" title="Filter by game">
      <option value="">All Games</option>
    </select>
    <select id="filter-weight" title="Filter by weight">
      <option value="">All Weights</option>
    </select>
    <select id="filter-height" title="Filter by height">
      <option value="">All Heights</option>
    </select>
  </div>

  <!-- Setter opp layout til hvordan alle er plassert-->
  <div id="pokemon-list" class="grid"></div>

  <!-- Linker til JavaScript -->
  <script src="Pokemon.js"></script>
  <!-- Link til hovedsiden -->
  <a href="../V.2hub.html">Main Page</a>
<footer>
<p>&copy; 2025 FXC Edition</p>
</footer>
</body>
</html>
